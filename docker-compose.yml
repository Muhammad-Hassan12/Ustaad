# Local container configuration for the Ustaad FastAPI backend.
# Supabase is an external managed service; configure backend/.env before starting.
# See frontend/README.md and docs/DEPLOYMENT.md for Next.js setup and production hosting.

services:
  backend:
    build:
      context: ./backend
    container_name: ustaad-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
